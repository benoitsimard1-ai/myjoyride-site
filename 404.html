<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rejoins la Joy Ride · My Joy Ride</title>
<style>
  :root { --bg: #f3f5f4; --fg: #1d2523; --muted: #5b6764; --accent: #0b6b4f; --accent-fg: #fff; --card: #fff; --line: #d6dcda; }
  @media (prefers-color-scheme: dark) { :root { --bg: #131917; --fg: #e5ebe9; --muted: #9aa8a4; --accent: #2fa37c; --accent-fg: #06130f; --card: #1b2321; --line: #2e3a37; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 56px 20px; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: 2rem; line-height: 1.15; margin: 0; }
  p { margin: 0; color: var(--muted); }
  .code { font-size: 2.2rem; font-weight: 800; letter-spacing: .08em; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; align-self: flex-start; font-variant-numeric: tabular-nums; }
  .btns { display: flex; flex-wrap: wrap; gap: 12px; }
  a.btn { display: inline-block; background: var(--accent); color: var(--accent-fg); text-decoration: none; font-weight: 700; padding: 12px 18px; border-radius: 10px; }
  a.btn.alt { background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <!-- Lien de Joy Ride : https://myjoyride.net/joinCode/05364312 -->
  <section id="ride" hidden>
    <h1 id="titre">Rejoins la Joy Ride</h1>
    <p id="numero">Numéro de la Joy Ride :</p>
    <div class="code" id="code"></div>
    <div class="btns">
      <a class="btn" id="ouvrir" href="#">Ouvrir dans My Joy Ride</a>
    </div>
    <p id="pasapp">Tu n'as pas encore l'app ? Installe-la, puis touche de nouveau le lien reçu.</p>
    <div class="btns">
      <a class="btn alt" href="https://testflight.apple.com/join/Qff9jC4G">iPhone (TestFlight)</a>
      <a class="btn alt" href="https://play.google.com/apps/internaltest/4700750454526321825">Android</a>
    </div>
  </section>
  <!-- Toute autre adresse inconnue -->
  <section id="perdu" hidden>
    <h1>My Joy Ride</h1>
    <p id="introuvable">Cette page n'existe pas.</p>
    <div class="btns"><a class="btn" href="/" id="accueil">Accueil</a></div>
  </section>
</main>
<script>
  (function () {
    var m = location.pathname.match(/^\/joinCode\/([0-9]{6}|[0-9]{8})\/?$/);
    var l = (navigator.language || "fr").slice(0, 2);
    var t = {
      en: { titre: "Join the Joy Ride", numero: "Joy Ride number:", ouvrir: "Open in My Joy Ride", pasapp: "Don't have the app yet? Install it, then tap the link you received again.", introuvable: "This page doesn't exist.", accueil: "Home" },
      es: { titre: "Únete al Joy Ride", numero: "Número del Joy Ride:", ouvrir: "Abrir en My Joy Ride", pasapp: "¿Aún no tienes la app? Instálala y vuelve a tocar el enlace que recibiste.", introuvable: "Esta página no existe.", accueil: "Inicio" }
    }[l];
    if (t) {
      document.documentElement.lang = l;
      for (var id in t) { var el = document.getElementById(id); if (el) el.textContent = t[id]; }
    }
    if (!m) { document.getElementById("perdu").hidden = false; return; }
    var c = m[1];
    document.getElementById("code").textContent =
      c.length === 6 ? c.slice(0, 3) + " " + c.slice(3) : c.slice(0, 4) + " " + c.slice(4);
    // Si l'app ne s'est pas ouverte toute seule (lien ouvert dans un
    // navigateur), ce bouton l'ouvre avec l'ancien lien de l'app.
    document.getElementById("ouvrir").href = "ride15sept://ride15sept.com/joinCode/" + c;
    document.getElementById("ride").hidden = false;
    if (!t) document.title = "Rejoins la Joy Ride · My Joy Ride";
    else document.title = t.titre + " · My Joy Ride";
  })();
</script>
</body>
</html>
